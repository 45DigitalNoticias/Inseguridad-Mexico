<style>

.bar .nm small{color:var(--dim);font-size:10.5px}
.bar .tk{height:11px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;margin-top:3px}

.muni-rk .bar{grid-template-columns:32px 1fr 96px}
.loading{text-align:center;padding:90px 0;font-family:'Spline Sans Mono',monospace;color:var(--mut);letter-spacing:1px}

</head><body><div class="bgwrap"><div class="wrap" id="wrap"><div class="loading" id="loading">Cargando ranking nacional…</div></div></div>
<script src="mexico_estados.geojson.js"></script>
<script src="panorama_estatal.js"></script>
<script src="delitos_completo.js"></script>
<script>
const RAMP=['#1a2db0','#2e6fde','#35b5e8','#3dbb6e','#8bc63f','#f3e13a','#fbb03b','#f4711f','#e02f1f'];
const fmt=n=>Number(Math.round(n)).toLocaleString('es-MX');
function ramp(t){t=Math.max(0,Math.min(1,t));const x=t*(RAMP.length-1),i=Math.min(RAMP.length-2,Math.floor(x)),k=x-i;const h=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const a=h(RAMP[i]),b=h(RAMP[i+1]);return`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')})`;}
function rings(g){return g.type==='Polygon'?[g.coordinates]:g.coordinates;}
function fetchJS(u,v){return fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.text();}).then(t=>(new Function(t+';return '+v+';'))());}
let SMA={},POB={},NAT=null,NOM={},ANIOS=[],NY=0,SUBS=[],SUBBJ={},STATES=[],yi=0,sub='__TOTAL__',modo='abs',timer=null;

Promise.all([
  fetchJS('series_mun/pob_mun.js','POB_MUN'),
  fetchJS('series_mun/nat_hd.js','NAT_HD_RATE'),
  fetchJS('series_mun/mun_nombres.js','MUN_NOMBRES'),
].concat(Array.from({length:32},(_,i)=>fetchJS(`series_mun/sma_${String(i+1).padStart(2,'0')}.js`,'SERIE_MUN_ANUAL').then(d=>({e:i+1,d})))))
.then(res=>{
  POB=res[0];NAT=res[1];NOM=res[2];
  res.slice(3).forEach(o=>SMA[o.e]=o.d);
  init();
}).catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el ranking.';console.error(e);});

function init(){
  const any=SMA[1]; ANIOS=any.anios.slice(0,any.anios.indexOf('2025')+1||any.anios.length); NY=ANIOS.length;
  // bj map (union)
  if(typeof DELITOS_COMPLETO_2025!=='undefined')Object.values(DELITOS_COMPLETO_2025).forEach(arr=>arr.forEach(d=>SUBBJ[d.s]=d.bj));
  // SUBS = union de subtipos, ordenado por total nacional 2025
  const set=new Set();Object.values(SMA).forEach(s=>Object.values(s.munis).forEach(m=>Object.keys(m).forEach(k=>set.add(k))));
  const li=NY-1;
  SUBS=[...set].sort((a,b)=>natTot(b,li)-natTot(a,li));
  STATES=(typeof PANORAMA_ESTATAL!=='undefined')?PANORAMA_ESTATAL.map(r=>({ent:r.clave_ent,nom:r.entidad.replace(' de Zaragoza','').replace(' de Ocampo','').replace(' de Ignacio de la Llave',''),color:r.color||'#22d3ee'})):[];
  STATES.sort((a,b)=>a.ent-b.ent);
  yi=NY-1; layout(); render();
}
function natTot(s,i){let v=0;for(const e in SMA)for(const cv in SMA[e].munis){const m=SMA[e].munis[cv];if(s==='__TOTAL__'){for(const k in m)v+=m[k][i]||0;}else if(m[s])v+=m[s][i]||0;}return v;}
function muniVal(e,cv,s,i){if(s==='__TOTAL__'){let v=0;const m=SMA[e].munis[cv];for(const k in m)v+=m[k][i]||0;return v;}const a=SMA[e].munis[cv][s];return a?a[i]||0:0;}
function pobOf(full,i){const p=POB[full];return p?p[i]:0;}
function metric(val,pop){return modo==='tasa'?(pop?val/pop*1e5:0):val;}

function layout(){
  document.getElementById('wrap').innerHTML=`
  <div class="top"><a href="index.html">◉ 45 DIGITAL NOTICIAS · ATLAS CIUDADANO</a><a class="v" href="index.html">‹ dashboard</a></div>
  <div class="bc"><a href="index.html">Nacional</a> › <b>Ranking</b></div>
  <div class="kick">55 DELITOS · 32 ESTADOS · 2,469 MUNICIPIOS · 2016-2025</div>
  <h1>Ranking nacional<br>de la inseguridad</h1>
  <div class="sub">Elige un delito y un año: el país se reordena. Quién encabeza homicidio no encabeza extorsión; quién manda en absolutos cae al cambiar a tasa por habitante. Estado por estado y municipio por municipio. Clic en cualquiera para abrir su panel.</div>
  <div class="ctrls">
    <div class="grp"><label>Delito</label><select class="delsel" id="delsel"></select></div>
    <div class="grp"><label>Medida</label><div class="modo"><button id="mAbs" class="on" onclick="setModo('abs')">Carpetas</button><button id="mTasa" onclick="setModo('tasa')">Tasa /100k</button></div></div>
    <div class="grp yrwrap"><label>Año</label><div class="lab"><span class="yr" id="yrBig"></span><button class="play" id="play">▶</button></div><input type="range" id="yr" min="0" max="${NY-1}" value="${NY-1}"><div class="ticks" id="ticks"></div></div>
  </div>
  <div class="head" id="head"></div>
  <div class="sec">Mapa · estados</div>
  <div class="grid">
    <div class="lcol">
      <div class="panel"><h3 id="mapTit">México por estado</h3><div style="position:relative"><svg id="mapsvg"></svg><div class="maptip" id="maptip"></div></div><div class="mapleg"><span>menos</span><span class="ramp"></span><span>más</span></div></div>
      <div class="panel scatpan"><h3>Volumen vs tasa · cada punto, un estado</h3><div class="scatsub" id="scatSub"></div><div style="position:relative"><svg id="scatsvg" viewBox="0 0 340 250"></svg><div class="maptip" id="scattip"></div></div></div>
    </div>
    <div class="panel"><h3>Los 32 estados</h3><div class="esc" id="escEdo"></div></div>
  </div>
  <div class="sec">Los municipios que encabezan</div>
  <div class="panel"><input class="search" id="search" placeholder="🔍 busca tu municipio (de los 2,469)…"><div class="esc muni-rk" id="escMun"></div></div>
  <footer>Fuente: SESNSP, incidencia delictiva municipal (corte abr-2026) · Población: INEGI Censo 2020 ajustada por año (CONAPO) · La tasa nivela municipios chicos y grandes; los absolutos no.<br>45 Digital Noticias · Atlas ciudadano de inseguridad · cada cifra trazable a su fuente.</footer>`;
  const ds=document.getElementById('delsel');
  let o0=document.createElement('option');o0.value='__TOTAL__';o0.textContent='Todos los delitos (total)';ds.appendChild(o0);
  SUBS.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ds.appendChild(o);});
  ds.onchange=()=>{sub=ds.value;render();};
  const yr=document.getElementById('yr');yr.oninput=()=>{yi=+yr.value;render();};
  document.getElementById('ticks').innerHTML=ANIOS.map(a=>`<span>${a.slice(2)}</span>`).join('');
  document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶';return;}this.textContent='⏸';timer=setInterval(()=>{yi=(yi+1)%NY;document.getElementById('yr').value=yi;render();},950);};
  document.getElementById('search').oninput=render;
  // mapa nacional
  const gj=(typeof MEXICO_ESTADOS_GEOJSON!=='undefined')?MEXICO_ESTADOS_GEOJSON:null;
  if(gj){let a=1e9,b=1e9,c=-1e9,d=-1e9;
    gj.features.forEach(f=>rings(f.geometry).forEach(p=>p.forEach(r=>r.forEach(([x,y])=>{if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y;}))));
    const W=620,sc=W/(c-a),H=(d-b)*sc;const ns='http://www.w3.org/2000/svg';const svg=document.getElementById('mapsvg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const tip=document.getElementById('maptip');
    gj.features.forEach(f=>{let s='';rings(f.geometry).forEach(p=>p.forEach(r=>{r.forEach(([x,y],i)=>{s+=(i?'L':'M')+((x-a)*sc).toFixed(1)+' '+((d-y)*sc).toFixed(1);});s+='Z';}));
      const path=document.createElementNS(ns,'path');path.setAttribute('d',s);path.dataset.ent=f.properties.clave_ent;
      path.onmousemove=e=>{tip.style.display='block';tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+14)+'px';tip.dataset.ent=f.properties.clave_ent;tip.textContent=tip._txt||'';};
      path.onclick=()=>{location.href='estado.html?estado='+f.properties.clave_ent;};svg.appendChild(path);});
    svg.addEventListener('mousemove',e=>{});
  }
}
function setModo(m){modo=m;document.getElementById('mAbs').classList.toggle('on',m==='abs');document.getElementById('mTasa').classList.toggle('on',m==='tasa');render();}
function scatter(edo){
  const W=340,H=250,PL=42,PB=28,PT=12,PR=14;
  const pts=edo.map(e=>({nom:e.nom,ent:e.ent,v:e.val,r:e.pop?e.val/e.pop*1e5:0}));
  const xmax=Math.max(...pts.map(p=>p.v),1),ymax=Math.max(...pts.map(p=>p.r),1);
  const X=v=>PL+(Math.sqrt(Math.max(0,v))/Math.sqrt(xmax))*(W-PL-PR),Y=r=>H-PB-(r/ymax)*(H-PB-PT);
  const byV=[...pts].sort((a,b)=>b.v-a.v),byR=[...pts].sort((a,b)=>b.r-a.r);
  const lab=new Set([byV[0],byV[1],byR[0],byR[1]].filter(Boolean).map(p=>p.ent));
  let s=`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#30363d"/><line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#30363d"/>`;
  s+=`<text x="${(PL+W-PR)/2}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#6b7480">carpetas →</text>`;
  s+=`<text transform="rotate(-90 11 ${(PT+H-PB)/2})" x="11" y="${(PT+H-PB)/2}" text-anchor="middle" font-size="8.5" fill="#6b7480">tasa /100k ↑</text>`;
  pts.forEach(p=>{const cx=X(p.v),cy=Y(p.r),L=lab.has(p.ent);
    s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${L?4.5:3}" fill="${ramp(p.r/ymax)}" stroke="${L?'#fff':'none'}" stroke-width="${L?1:0}" opacity=".9"><title>${p.nom}: ${fmt(p.v)} carpetas · ${p.r.toFixed(1)}/100k</title></circle>`;
    if(L)s+=`<text x="${(cx+6).toFixed(1)}" y="${(cy+3).toFixed(1)}" font-size="9" fill="#c9d1d9">${p.nom}</text>`;});
  document.getElementById('scatsvg').innerHTML=s;
  document.getElementById('scatSub').innerHTML=`Derecha = más carpetas; arriba = más por habitante. En volumen manda <b>${byV[0].nom}</b>; por habitante, <b>${byR[0].nom}</b>. Rara vez el mismo.`;
}
function render(){
  document.getElementById('yrBig').textContent=ANIOS[yi];
  // estados
  const edo=STATES.map(s=>{let v=0,p=0;const M=SMA[s.ent].munis;for(const cv in M){v+=muniVal(s.ent,cv,sub,yi);p+=pobOf(s.ent*1000+parseInt(cv),yi);}return{...s,val:v,pop:p,m:metric(v,p)};});
  const emax=Math.max(...edo.map(x=>x.m),1);
  // mapa recolorea + tooltip
  const svg=document.getElementById('mapsvg');const byEnt={};edo.forEach(x=>byEnt[x.ent]=x);
  if(svg)svg.querySelectorAll('path').forEach(p=>{const x=byEnt[+p.dataset.ent];const t=x?x.m/emax:0;p.setAttribute('fill',ramp(t));
    p.onmousemove=ev=>{const tip=document.getElementById('maptip');tip.style.display='block';tip.style.left=(ev.offsetX+14)+'px';tip.style.top=(ev.offsetY+14)+'px';tip.textContent=`${x?x.nom:''}: ${x?(modo==='tasa'?x.m.toFixed(1):fmt(x.m)):''}`;};
    p.onmouseleave=()=>{document.getElementById('maptip').style.display='none';};});
  // escalada estados
  const eor=edo.slice().sort((a,b)=>b.m-a.m);
  document.getElementById('escEdo').innerHTML=eor.map((x,i)=>`<div class="bar" onclick="location.href='estado.html?estado=${x.ent}'"><div class="rk">${i+1}</div><div class="nm">${x.nom}<div class="tk"><div class="fl" style="width:${Math.max(2,100*x.m/emax)}%;background:${ramp(x.m/emax)}"></div></div></div><div class="vv">${modo==='tasa'?x.m.toFixed(1):fmt(x.m)}</div></div>`).join('');
  // municipios
  let mun=[];for(const e in SMA){const ent=+e;for(const cv in SMA[e].munis){const full=ent*1000+parseInt(cv);const v=muniVal(ent,cv,sub,yi);const p=pobOf(full,yi);mun.push({full,ent,nom:NOM[full]||('Mun '+full),est:(byEnt[ent]?byEnt[ent].nom:''),m:metric(v,p),val:v});}}
  if(modo==='tasa')mun=mun.filter(x=>x.val>=5||x.m===0); // evita tasas absurdas de municipios diminutos con 1-2 casos
  mun.sort((a,b)=>b.m-a.m);
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let show=mun.slice(0,40),extra='';
  if(q){const hits=mun.filter(x=>x.nom.toLowerCase().includes(q)||x.est.toLowerCase().includes(q));show=hits.slice(0,40);extra=` · ${hits.length} coincidencia(s)`;}
  const mmax=Math.max(...mun.map(x=>x.m),1);
  const rankPos={};mun.forEach((x,i)=>rankPos[x.full]=i+1);
  document.getElementById('escMun').innerHTML=show.map(x=>`<div class="bar" onclick="location.href='municipio.html?cve=${String(x.full).padStart(5,'0')}'"><div class="rk">${rankPos[x.full]}</div><div class="nm">${x.nom} <small>· ${x.est}</small><div class="tk"><div class="fl" style="width:${Math.max(2,100*x.m/mmax)}%;background:${ramp(x.m/mmax)}"></div></div></div><div class="vv">${modo==='tasa'?x.m.toFixed(1):fmt(x.m)}</div></div>`).join('')||'<div style="color:var(--dim);padding:10px">sin coincidencias</div>';
  // headline
  const topE=eor[0],topM=mun[0];const label=sub==='__TOTAL__'?'carpetas (todos los delitos)':sub;
  const natv=natTot(sub,yi);
  document.getElementById('head').innerHTML=`En <span class="hot">${ANIOS[yi]}</span>, <b>${label}</b> sumó <b class="am">${fmt(natv)}</b> carpetas en el país. Estado al frente: <b class="am">${topE.nom}</b> · municipio: <b class="am">${topM?topM.nom:''}</b>${q?'<span style="color:var(--dim);font-size:13px">'+extra+'</span>':''}.`;
  document.getElementById('mapTit').textContent=`México por estado · ${modo==='tasa'?'tasa /100k':'carpetas'} · ${ANIOS[yi]}`;
  scatter(edo);
}
