<style>

<div id="map"></div>
<div id="err" style="position:absolute;z-index:9999;top:8px;left:50%;transform:translateX(-50%);background:#bd0026;color:#fff;font:13px monospace;padding:6px 10px;border-radius:6px;display:none"></div>

<div class="panel titulo">
 <h1 id="h1">Corredores ferroviarios</h1>
 <div class="sub">Tres trenes, tres firmas: el Istmo (homicidio), el Tren Maya (extorsión y narco) y la red de carga (robo al tren), cada uno leído por su firma delictiva. Color = intensidad del delito elegido.</div>
 <a class="dash" href="https://45digitalnoticias.github.io/Inseguridad-Mexico/" target="_blank" rel="noopener">◉ Inseguridad México ↗</a>
</div>

<div class="panel ctrl">
 <div class="lab">Corredor</div>
 <div class="segs" id="segCor">
  <div class="seg ce" data-c="istmo">Istmo</div>
  <div class="seg cm" data-c="maya">Tren Maya</div>
  <div class="seg cc" data-c="carga">Carga</div>
  <div class="seg on" data-c="ambos">Sureste</div>
 </div>
 <div class="lab" id="labDel">Delito</div>
 <div class="segs" id="segDel"></div>
 <div class="lab">Año: <span class="yv" id="yv">2024</span></div>
 <input id="yr" type="range" min="0" max="7" step="1" value="6">
</div>

<div class="panel card" id="card"></div>
<div class="panel leg" id="leg"></div>

<script src="corredores_data.js"></script>
<script src="corredor_ferro_geo.js"></script>
<script src="red_ferroviaria.js"></script>
<script>
try{
const D=CORREDORES, AN=D.anios;
const CFG=(typeof CORREDOR_FERRO_GEO!=='undefined')?CORREDOR_FERRO_GEO:null;
const RED=(typeof RED_FERROVIARIA!=='undefined')?RED_FERROVIARIA:null;
let COR='ambos', DEL='hd', YR=AN.indexOf('2024');
const _p=new URLSearchParams(location.search);
if(['istmo','maya','ambos','carga'].includes(_p.get('cor'))) COR=_p.get('cor');
const CARGA=()=>COR==='carga';
function years(){return CARGA()?CFG.anios:AN;}
const map=L.map('map',{zoomControl:false}).setView([18.2,-92.5],6);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:13,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
const COLOR=['#3a3f48','#ffffcc','#fed976','#feb24c','#fd8d3c','#f03b20','#bd0026'];
const COLINE={istmo:'#a78bfa',maya:'#22d3ee'};
const ST_ICON=L.divIcon({className:'stIcon',html:'🚉',iconSize:[18,18],iconAnchor:[9,9]});
const DELS={sureste:[['hd','Homicidio'],['ext','Extorsión'],['narco','Narco'],['tot','Total 55']],
            carga:[['ar','Robo al tren'],['st','Robo a transportista']]};
function delOpts(){return CARGA()?DELS.carga:DELS.sureste;}
const DELNAME={hd:'Homicidio',ext:'Extorsión',narco:'Narcomenudeo',tot:'Total 55',ar:'Robo al tren · ARTF',st:'Robo a transportista · SESNSP'};
function val(f){return f.s[DEL][YR]||0;}
function visible(f){return COR==='ambos'||f.cor===COR;}
function maxVis(){let m=0; D.feats.forEach(f=>{if(visible(f)){const v=val(f); if(v>m)m=v;}}); return m||1;}
function col(v,mx){if(v<=0)return COLOR[0]; const r=v/mx; return r>.75?COLOR[6]:r>.5?COLOR[5]:r>.3?COLOR[4]:r>.15?COLOR[3]:r>.05?COLOR[2]:COLOR[1];}
function cval(p){return (p[DEL]||[])[YR]||0;}
function cmax(){let m=0; CFG.features.forEach(f=>{const v=cval(f.properties); if(v>m)m=v;}); return m||1;}
// capas de polígonos (municipios sureste o estados carga)
let polyLayers=[];
function buildPolys(){
 polyLayers.forEach(l=>map.removeLayer(l)); polyLayers=[];
 if(CARGA()){
  const mx=cmax();
  const lyr=L.geoJSON(CFG,{style:f=>({fillColor:col(cval(f.properties),mx),weight:1,color:'#3a4048',fillOpacity:.82})});
  lyr.eachLayer(l=>{const p=l.feature.properties; l.bindTooltip(`<b>${p.estado}</b><br>${DELNAME[DEL]} ${years()[YR]}: <b>${cval(p).toLocaleString('es-MX')}</b>`,{className:'tt',sticky:true});});
  lyr.addTo(map); polyLayers.push(lyr); return;
 }
 const mx=maxVis();
 D.feats.forEach(f=>{
  if(!visible(f))return;
  const lyr=L.geoJSON({type:'Feature',geometry:f.geo},{style:{fillColor:col(val(f),mx),weight:1,color:COLINE[f.cor],fillOpacity:.86}});
  lyr.bindTooltip(()=>`<b>${f.name}</b> <span style="color:#9aa4b2">(${f.cor==='istmo'?'Istmo':'Tren Maya'})</span><br>${({hd:'Homicidio',ext:'Extorsión',narco:'Narcomenudeo',tot:'Total 55 delitos'})[DEL]} ${AN[YR]}: <b>${val(f).toLocaleString('es-MX')}</b>`,{className:'tt',sticky:true});
  lyr.addTo(map); polyLayers.push(lyr);
 });
}
// líneas férreas + estaciones
let railLayers=[];
function buildRail(){
 railLayers.forEach(l=>map.removeLayer(l)); railLayers=[];
 if(CARGA()){
  if(!RED)return;
  const idle=RED.segs.filter(s=>!s.op).map(s=>s.p.map(pt=>[pt[1],pt[0]]));
  const oper=RED.segs.filter(s=>s.op).map(s=>s.p.map(pt=>[pt[1],pt[0]]));
  railLayers.push(L.polyline(idle,{color:'#7a5c30',weight:1,opacity:.32}).addTo(map));
  railLayers.push(L.polyline(oper,{color:'#e8a13a',weight:1.4,opacity:.72}).addTo(map));
  return;
 }
 [['istmo',Object.values(D.lines.istmo||{})],['maya',(D.lines.maya&&D.lines.maya.length)?[D.lines.maya]:[]]].forEach(([cor,routes])=>{
  if(!(COR==='ambos'||COR===cor))return;
  (routes||[]).forEach(r=>{
   if(!r||!r.length)return;
   railLayers.push(L.polyline(r,{color:'#0b0f16',weight:6,opacity:.9}).addTo(map));
   railLayers.push(L.polyline(r,{color:COLINE[cor],weight:2.6,opacity:1}).addTo(map));
  });
  const sts=(D.stations[cor]||[]);
  sts.forEach(s=>{
   const lat=s.lat||(s[0]), lon=s.lon||(s[1]); if(lat==null)return;
   railLayers.push(L.marker([lat,lon],{icon:ST_ICON,zIndexOffset:1000}).addTo(map).bindTooltip('🚉 '+(s.n||s.name||''),{className:'tt',direction:'top'}));
  });
 });
}
function fit(){
 if(CARGA()){map.fitBounds([[14.4,-118.6],[32.8,-86.5]],{padding:[18,18]});return;}
 const b=[]; D.feats.forEach(f=>{if(visible(f)){try{b.push(L.geoJSON({type:'Feature',geometry:f.geo}).getBounds())}catch(e){}}});
 if(b.length){let bb=b[0]; b.slice(1).forEach(x=>bb.extend(x)); map.fitBounds(bb,{padding:[40,40]});}
}
// tarjeta dinámica
const CARDS={
 istmo:{dot:'#a78bfa',h:'Istmo · la guerra por la ruta',
  p:'Entre 2021 y 2024 el homicidio en la vía subió <b>+69.1%</b>, pero el <b>total de los 55 delitos bajó −20.4%</b> (más que su región y que el país) y el robo cayó −37.4%. Solo se disparó lo letal. No es más delito: es <b>guerra por el control</b>. El premio es el peaje, y por él se mata (Tilly, 1985). En 2025 el homicidio cedió (−26.2%), pero el narcomenudeo saltó (+139%).',
  s:'Corredor Interoceánico (Líneas Z, FA, K) · SESNSP municipal, corte may-2026'},
 maya:{dot:'#22d3ee',h:'Tren Maya · el cobro de piso',
  p:'Por homicidio parece tranquilo (<b>−6.5%</b>), pero el <b>total subió +8.1%</b> en la ruta mientras su región bajaba, empujado por <b>extorsión +47%</b> y <b>narcomenudeo +87%</b>. La firma no es matar, es cobrar: la venta de protección sobre una economía que el tren multiplicó (Gambetta, 1993).',
  s:'Ruta del Tren Maya · SESNSP municipal, corte may-2026'},
 ambos:{dot:'#fbbf24',h:'Dos trenes del sureste, dos firmas',
  p:'El <b>Istmo se pelea a tiros</b> (homicidio +69.1%, el delito total a la baja): guerra por quedarse con el paso. El <b>Tren Maya ya factura</b> (extorsión +47%, narco +87%): cobro por dejar pasar. Cambia el delito y mueve el año para ver cómo cada corredor enciende el suyo.',
  s:'Istmo y Tren Maya · SESNSP municipal, corte may-2026 · 45 Digital Noticias'},
 carga:{dot:'#e8a13a',h:'Carga · el saqueo',
  p:'El robo al tren se concentra en la <b>espina Ferromex</b> (Bajío, norte y Pacífico), donde converge la carga automotriz y de exportación. Y el <b>SESNSP casi no lo ve</b>: en Aguascalientes hubo 470 robos al tren (ARTF) y <b>0</b> en robo a transportista (SESNSP). El saqueo sigue a la carga, no a la pobreza. Cambia el toggle para ver la doble contabilidad.',
  s:'ARTF (robo al tren) + SESNSP (robo a transportista) · corte ARTF oct-2025 (2025 parcial)'}
};
function setCard(){const c=CARDS[COR]; document.getElementById('card').innerHTML=`<h2><span class="dot" style="background:${c.dot}"></span>${c.h}</h2><p>${c.p}</p><p class="src">Fuente: ${c.s}</p>`;}
function setLeg(){
 const railNote = CARGA()
  ? '<span class="rail" style="border-color:#e8a13a"></span> red de carga · color por estado'
  : '<span class="rail"></span> vía · color relativo al máximo visible';
 document.getElementById('leg').innerHTML='<b>'+DELNAME[DEL]+' '+years()[YR]+'</b><br>'+
  [['#bd0026','más'],['#fd8d3c','medio'],['#fed976','poco'],['#3a3f48','0']].map(x=>`<div><i style="background:${x[0]}"></i>${x[1]}</div>`).join('')+
  '<hr style="border-color:#30363d;margin:6px 0">'+railNote;
}
function renderDel(){
 document.getElementById('segDel').innerHTML=delOpts().map(([d,t])=>`<div class="seg${d===DEL?' on':''}" data-d="${d}">${t}</div>`).join('');
 const ys=years(), yr=document.getElementById('yr');
 yr.max=ys.length-1; if(YR>ys.length-1)YR=ys.length-1; yr.value=YR;
 document.getElementById('yv').textContent=ys[YR];
 document.getElementById('h1').textContent = CARGA()?'Corredores ferroviarios · Carga':'Corredores ferroviarios';
}
function redrawColor(){buildPolys();setLeg();}
function redrawAll(){buildPolys();buildRail();setCard();setLeg();fit();}
// controles
document.getElementById('segCor').onclick=e=>{const t=e.target.closest('.seg');if(!t)return;
 const wasC=CARGA(); COR=t.dataset.c;
 document.querySelectorAll('#segCor .seg').forEach(s=>s.classList.toggle('on',s===t));
 if(wasC!==CARGA()){ DEL=CARGA()?'ar':'hd'; YR=years().length-1; }
 renderDel(); redrawAll();
};
document.getElementById('segDel').onclick=e=>{const t=e.target.closest('.seg');if(!t)return;DEL=t.dataset.d;document.querySelectorAll('#segDel .seg').forEach(s=>s.classList.toggle('on',s===t));redrawColor();};
document.getElementById('yr').oninput=e=>{YR=+e.target.value;document.getElementById('yv').textContent=years()[YR];redrawColor();};
document.querySelectorAll('#segCor .seg').forEach(s=>s.classList.toggle('on',s.dataset.c===COR));
if(CARGA()){DEL='ar';YR=years().length-1;}
renderDel(); redrawAll();
}catch(e){var d=document.getElementById('err');d.style.display='block';d.textContent='ERR: '+e.message;}
</script>
</body></html>
