<script>
const RAMP=['#00808a','#4ba3a3','#9fc7a6','#e2dd9a','#f4c04e','#e67e39','#d64a3a','#b42222'];
const fmt=n=>Number(Math.round(n)).toLocaleString('es-MX');
const BJC={"El patrimonio":"#fbbf24","La vida y la Integridad corporal":"#f4711f","La libertad personal":"#a78bfa","La libertad y la seguridad sexual":"#ec4899","La familia":"#22d3ee","La sociedad":"#3fb950","Otros bienes jurídicos afectados (del fuero común)":"#94a3b8"};
const PAIRS0=[["Homicidio doloso","Otros delitos que atentan contra la vida y la integridad corporal"],["Secuestro","Otros delitos que atentan contra la libertad personal"],["Violación simple","Otros delitos que atentan contra la libertad y la seguridad sexual"],["Robo a casa habitación","Otros robos"]];
function ramp(t){t=Math.max(0,Math.min(1,t||0));const x=t*(RAMP.length-1),i=Math.min(RAMP.length-2,Math.floor(x)),k=x-i;const h=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const a=h(RAMP[i]),b=h(RAMP[i+1]);return`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')})`;}
function rings(g){return g.type==='Polygon'?[g.coordinates]:g.coordinates;}
function fetchJS(url,varname){return fetch(url).then(r=>{if(!r.ok)throw new Error(url);return r.text();}).then(t=>(new Function(t+';return '+varname+';'))());}
const P=new URLSearchParams(location.search);let CVE=(P.get('cve')||'01001').replace(/\D/g,'').padStart(5,'0');
let D=null,yi=0,del='__TOTAL__',fixOrder=false,timer=null,escOrder=null,me=null,meTot=null;

function boot(){
  const ent=parseInt(CVE.slice(0,2)),mw=parseInt(CVE.slice(2)),id=String(ent).padStart(2,'0');
  Promise.all([
    fetchJS(`series_mun/sma_${id}.js`,'SERIE_MUN_ANUAL'),
    fetch(`series_mun/gm_${id}.json`).then(r=>r.json()),
    fetchJS(`series_mun/smun_${id}.js`,'SERIE_MUNICIPAL').catch(()=>null),
    fetchJS(`series_mun/pob_mun.js`,'POB_MUN').catch(()=>({})),
    fetchJS(`series_mun/nat_hd.js`,'NAT_HD_RATE').catch(()=>null),
  ]).then(([sma,gm,smu,pob,nat])=>{build(ent,mw,id,sma,gm,smu,pob,nat);})
   .catch(e=>{document.getElementById('loading').textContent='No se pudo cargar este municipio ('+CVE+').';console.error(e);});
}
function build(ent,mw,id,sma,gm,smu,pob,nat){
  const pan=(typeof PANORAMA_ESTATAL!=='undefined')?PANORAMA_ESTATAL.find(r=>r.clave_ent===ent):null;
  const estado=pan?pan.entidad.replace(' de Zaragoza','').replace(' de Ocampo','').replace(' de Ignacio de la Llave',''):'';
  const acc=(pan&&pan.color)?pan.color:'#f4711f';document.documentElement.style.setProperty('--acc',acc);
  const DC=(typeof DELITOS_COMPLETO_2025!=='undefined')?(DELITOS_COMPLETO_2025[String(ent)]||[]):[];
  const bj_order=[],sub_bj={},SUBS=[];
  DC.forEach(d=>{if(!bj_order.includes(d.bj))bj_order.push(d.bj);sub_bj[d.s]=d.bj;SUBS.push(d.s);});
  const NY=sma.anios.indexOf('2025')+1||sma.anios.length;const anios=sma.anios.slice(0,NY);
  // geometria
  let a=1e9,b=1e9,c=-1e9,dd=-1e9;
  // bbox excluyendo islas lejanas (ej. Revillagigedo en Colima): descarta anillos cuyo centroide está muy lejos del centro
  {const _R=[];gm.features.forEach(f=>rings(f.geometry).forEach(p=>p.forEach(r=>_R.push(r))));
   const _all=[];_R.forEach(r=>r.forEach(q=>_all.push(q)));
   const _md=arr=>{const s=arr.slice().sort((u,v)=>u-v);return s.length?s[s.length>>1]:0;};
   const _cx=_md(_all.map(q=>q[0])),_cy=_md(_all.map(q=>q[1]));
   const _dist=_R.map(r=>{let sx=0,sy=0;r.forEach(q=>{sx+=q[0];sy+=q[1];});return Math.hypot(sx/r.length-_cx,sy/r.length-_cy);});
   const _thr=Math.max(_md(_dist)*5,1.0);
   _R.forEach((r,k)=>{if(_dist[k]>_thr)return;r.forEach(([x,y])=>{if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>dd)dd=y;});});}
  const W=520,sc=W/(c-a),H=(dd-b)*sc;
  const pathOf=f=>{let s='';rings(f.geometry).forEach(p=>p.forEach(r=>{r.forEach(([x,y],i)=>{s+=(i?'L':'M')+((x-a)*sc).toFixed(1)+' '+((dd-y)*sc).toFixed(1);});s+='Z';}));return s;};
  const MUNIS={};gm.features.forEach(f=>{MUNIS[String(f.properties.cve)]={nombre:f.properties.nombre,path:pathOf(f)};});
  // matrices
  const M={},TOT={};gm.features.forEach(f=>{const cv=String(f.properties.cve);const m=sma.munis[cv]||{};M[cv]={};SUBS.forEach(s=>M[cv][s]=(m[s]||[]).slice(0,NY));TOT[cv]=anios.map((_,i)=>SUBS.reduce((q,s)=>q+(M[cv][s][i]||0),0));});
  // mensual de este muni
  const MONTH={};if(smu&&smu.munis&&smu.munis[String(mw)]){const mm=smu.munis[String(mw)];Object.keys(mm).forEach(k=>{MONTH[k]=[];for(let y=0;y<NY;y++){MONTH[k].push(mm[k].slice(y*12,y*12+12).map(x=>x||0));}});}
  const subind=s=>{const sl=(s||'').toLowerCase();if(s==='Homicidio doloso')return'hd';if(s==='Feminicidio')return'feminicidio';if(s==='Extorsión')return'extorsion';if(s==='Secuestro')return'secuestro';if(sl==='violencia familiar')return'violencia_familiar';if(sl.startsWith('violación'))return'violacion';if(sl.indexOf('narcomenudeo')>=0)return'narcomenudeo';return null;};
  const SUBIND={};SUBS.forEach(s=>SUBIND[s]=subind(s));
  const full=ent*1000+mw;const pobYr=(pob&&pob[full])?pob[full]:null;
  const statePob=anios.map((_,i)=>gm.features.reduce((q,f)=>{const pv=pob[ent*1000+f.properties.cve];return q+(pv?pv[i]:0);},0));
  const pairs=PAIRS0.filter(([h,e])=>SUBS.includes(h)&&SUBS.includes(e));
  const espejo=pairs.map(p=>p[1]);
  D={ent,mw,full,cve:String(mw),nom:MUNIS[String(mw)]?MUNIS[String(mw)].nombre:('Municipio '+CVE),estado,clave:CVE,
     anios,NY,nmun:gm.features.length,vb:[W,H],munis:MUNIS,M,TOT,subs:SUBS,sub_bj,bj_order,bjc:BJC,
     espejo,pairs,month:MONTH,subind:SUBIND,pobYr,statePob,nat:nat||null};
  me=M[String(mw)];meTot=TOT[String(mw)];yi=NY-1;
  layout();render();
}

function layout(){
  document.getElementById('wrap').innerHTML=`
  <div class="top"><a href="index.html">◉ 45 DIGITAL NOTICIAS · ATLAS CIUDADANO</a><a class="v" href="estado.html?estado=${D.ent}">‹ ${D.estado||'estado'}</a><div class="tog" style="margin-left:10px"><button data-t="dark" class="${(document.documentElement.dataset.theme||'dark')==='dark'?'on':''}" onclick="setT('dark')">Oscuro</button><button data-t="light" class="${document.documentElement.dataset.theme==='light'?'on':''}" onclick="setT('light')">Claro</button></div></div>
  <div class="bc"><a href="index.html">Nacional</a> › <a href="estado.html?estado=${D.ent}">${D.estado}</a> › <b>${D.nom}</b> (municipio)</div>
  <div class="hero">
    <div>
      <div class="kick">CLAVE INEGI ${D.clave} · POBLACIÓN 2020: ${D.pobYr?fmt(D.pobYr[D.anios.indexOf('2020')]):'s/d'} · SESNSP CORTE JUN-2026</div>
      <h1>${D.nom}</h1>
      <div class="sub">Tu municipio, año por año. Mueve el tiempo y mira cómo cambia el panorama. El dato del SESNSP llega a nivel municipio (no por colonia), así que aquí respondemos lo que sí podemos con rigor: cómo te comparas, cuándo ocurre y qué delitos pesan.</div>
      <div class="diag" id="diag"></div>
      <div class="scrub"><div class="lab"><span class="yr" id="yrBig"></span><span class="ylab">año en pantalla<br>arrastra el tiempo</span><button class="play" id="play">▶ reproducir</button></div>
        <input type="range" id="yr" min="0" max="${D.NY-1}" step="1" value="${D.NY-1}"><div class="ticks" id="ticks"></div></div>
    </div>
    <div class="mapcard">
      <div class="mh"><span class="t">Posición comparativa<br>${D.estado} por municipio</span><select class="delsel" id="delMap"></select></div>
      <svg id="mapsvg"></svg><div class="maptip" id="maptip"></div>
      <div class="mapleg"><span>menos</span><span class="ramp"></span><span>más</span></div>
      <div class="maphint">No es calor interior del municipio (no hay dato por colonia): cada municipio es un valor real comparable. Clic en otro municipio para visitarlo.</div>
    </div>
  </div>
  <div class="sec">Qué tan grave · cuándo ocurre</div>
  <div class="split">
    <div class="panel"><h3 id="termoTit">Termómetro · homicidio doloso</h3><div class="cap">tasa por 100 mil habitantes · año en pantalla</div><div class="tbar" id="termo"></div><div class="pos" id="pos"></div></div>
    <div class="panel"><h3 id="heatTit">¿Cuándo ocurre?</h3><div class="cap">intensidad por mes y año · el "cuándo" en vez del "dónde"</div><div class="heat" id="heat"></div>
      <div class="hcap"><span>menos</span><span class="ramp" style="max-width:120px"></span><span>más</span><span id="heatNote" style="margin-left:auto"></span></div></div>
  </div>
  <div class="sec">Señales de reclasificación · pares espejo</div>
  <div style="font-size:13px;color:var(--mut);margin:-4px 0 14px;max-width:780px;line-height:1.5">Cada par enfrenta un delito grave con el "cajón" donde puede reclasificarse. Si el grave baja y su espejo sube, hay que mirar de cerca: cambio de criterio, reforma o trasvase. Las dos líneas van ${D.anios[0]}→${D.anios[D.NY-1]}.</div>
  <div id="espejo"></div>
  <div class="sec">La radiografía · escalada de ${D.subs.length} delitos</div>
  <div class="escTop"><span class="lg" id="escLg">ordenado por carpetas · año en pantalla · clic para ver en el tablero</span><button class="fixbtn" id="fix">fijar orden</button></div>
  <div class="esc" id="esc"></div>
  <footer>Fuente: SESNSP, incidencia delictiva municipal (corte jun-2026) · Población: INEGI Censo 2020 ajustada por año con crecimiento estatal CONAPO · Tasa nacional de homicidio por año (CONAPO+SESNSP) · El mapa compara municipios entre sí; no representa concentración por colonia.<br>45 Digital Noticias · Atlas ciudadano de inseguridad · cada cifra trazable a su fuente.</footer>`;
  // selector
  const delMap=document.getElementById('delMap');
  let o0=document.createElement('option');o0.value='__TOTAL__';o0.textContent='Todos los delitos (total)';delMap.appendChild(o0);
  D.subs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;delMap.appendChild(o);});
  delMap.onchange=()=>{del=delMap.value;render();};
  const yr=document.getElementById('yr');yr.oninput=()=>{yi=+yr.value;render();};
  document.getElementById('ticks').innerHTML=D.anios.map(a=>`<span>${a.slice(2)}</span>`).join('');
  // mapa
  const ns='http://www.w3.org/2000/svg';const svg=document.getElementById('mapsvg');svg.setAttribute('viewBox',`0 0 ${D.vb[0]} ${D.vb[1]}`);
  const tip=document.getElementById('maptip');
  Object.entries(D.munis).forEach(([cv,m])=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',m.path);p.dataset.cv=cv;
    if(cv===D.cve)p.classList.add('me');
    p.onmousemove=e=>{tip.style.display='block';tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+14)+'px';tip.textContent=`${m.nombre}: ${fmt(muniVal(cv,yi))}`;};
    p.onmouseleave=()=>tip.style.display='none';
    p.onclick=()=>{if(cv!==D.cve){location.href='municipio.html?cve='+String(D.ent*1000+parseInt(cv)).padStart(5,'0');}};
    svg.appendChild(p);});
  document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶ reproducir';return;}this.textContent='⏸ pausa';timer=setInterval(()=>{yi=(yi+1)%D.NY;document.getElementById('yr').value=yi;render();},950);};
  document.getElementById('fix').onclick=function(){fixOrder=!fixOrder;this.classList.toggle('on',fixOrder);if(fixOrder)escOrder=buildEscOrder();esc();document.getElementById('escLg').textContent=fixOrder?'orden fijo (sigue un delito en el tiempo) · clic para verlo':'ordenado por carpetas · año en pantalla · clic para ver en el tablero';};
}
function muniVal(cv,i){return del==='__TOTAL__'?((D.TOT[cv]||[])[i]||0):((D.M[cv][del]||[])[i]||0);}
function meVal(i){return del==='__TOTAL__'?((meTot||[])[i]||0):((me[del]||[])[i]||0);}
function stateVal(i){return Object.keys(D.M).reduce((q,cv)=>q+muniVal(cv,i),0);}
function delLabel(){return del==='__TOTAL__'?'carpetas en total':del.toLowerCase();}
function buildEscOrder(){return D.subs.slice().sort((x,y)=>(((me[y]||[])[yi]||0)-((me[x]||[])[yi]||0)));}
function termo(){
  const y=yi;const hd=me['Homicidio doloso']?me['Homicidio doloso'][y]:0;
  const tm=D.pobYr?hd/D.pobYr[y]*1e5:null;
  const sHD=Object.keys(D.M).reduce((q,cv)=>q+(D.M[cv]['Homicidio doloso']?D.M[cv]['Homicidio doloso'][y]:0),0);
  const te=D.statePob[y]?sHD/D.statePob[y]*1e5:null;
  const tn=D.nat?D.nat[y]:null;
  const mx=Math.max(tm||0,te||0,tn||0,1)*1.1;
  const row=(l,v,c)=>`<div class="tb"><div class="l">${l}</div><div class="track"><div class="fill" style="width:${v!=null?100*v/mx:0}%;background:${c}"></div></div><div class="v">${v!=null?v.toFixed(1):'s/d'}</div></div>`;
  document.getElementById('termoTit').textContent=`Termómetro · homicidio doloso ${D.anios[y]}`;
  document.getElementById('termo').innerHTML=row(D.nom,tm,'var(--acc)')+row('Media estatal',te,'#fbbf24')+row('Media nacional',tn,'#94a3b8');
  // rank estatal por HD del año
  const rk=Object.keys(D.M).sort((x,z)=>(D.M[z]['Homicidio doloso']?D.M[z]['Homicidio doloso'][y]:0)-(D.M[x]['Homicidio doloso']?D.M[x]['Homicidio doloso'][y]:0));
  const pos=rk.indexOf(D.cve)+1;
  document.getElementById('pos').innerHTML=`Posición estatal por homicidio (${D.anios[y]}): <b>#${pos}</b> de ${D.nmun} municipios.`+(tm!=null&&tn!=null?` Su tasa es <b>${(tm/tn).toFixed(1)}×</b> la nacional.`:'');
}
function heat(){
  const ind=del==='__TOTAL__'?'total':D.subind[del];const cont=document.getElementById('heat');const note=document.getElementById('heatNote');
  document.getElementById('heatTit').textContent=del==='__TOTAL__'?'¿Cuándo ocurre? · todos los delitos':`¿Cuándo ocurre? · ${del}`;
  const MES=['E','F','M','A','M','J','J','A','S','O','N','D'];
  if(!ind||!D.month[ind]){note.textContent='mensual solo para indicadores clave';
    const sk=del==='__TOTAL__'?meTot:(me[del]||[]);const mx=Math.max(...sk,1);
    cont.style.gridTemplateColumns=`repeat(${D.NY},1fr)`;
    cont.innerHTML=sk.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px"><div class="cell ${i===yi?'col':''}" title="${D.anios[i]}: ${fmt(v)}" style="width:100%;height:${10+62*v/mx}px;background:${ramp(v/mx)}"></div><div style="font-family:'Spline Sans Mono',monospace;font-size:9px;color:${i===yi?'var(--acc)':'var(--dim)'}">${D.anios[i].slice(2)}</div></div>`).join('');
    return;}
  note.textContent='';cont.style.gridTemplateColumns=`26px repeat(${D.NY},1fr)`;
  const G=D.month[ind];let mx=1;G.forEach(yy=>yy.forEach(v=>{if(v>mx)mx=v;}));
  let html='<div></div>'+D.anios.map(a=>`<div class="hy">${a.slice(2)}</div>`).join('');
  for(let mo=0;mo<12;mo++){html+=`<div class="hm">${MES[mo]}</div>`;for(let a=0;a<D.NY;a++){const v=G[a]?G[a][mo]:0;html+=`<div class="cell ${a===yi?'col':''}" title="${MES[mo]} ${D.anios[a]}: ${fmt(v)}" style="background:${v?ramp(v/mx):'color-mix(in srgb,var(--txt) 5%,transparent)'}"></div>`;}}
  cont.innerHTML=html;
}
function dpc(a,b){return b?Math.round(100*(a-b)/b):(a?null:0);}
function dArrow(x){return x===null?'<span style="color:#fbbf24">nuevo</span>':(x>0?`<span style="color:#f85149">▲ +${x}%</span>`:(x<0?`<span style="color:#3fb950">▼ ${x}%</span>`:'<span style="color:var(--mut)">=</span>'));}
function espejo(){
  const i18=D.anios.indexOf('2018');const W=250,H=46;
  document.getElementById('espejo').innerHTML=D.pairs.map(([h,e])=>{
    const hs=me[h]||[],es=me[e]||[];const hv=hs[yi]||0,ev=es[yi]||0;const hd=dpc(hv,hs[i18]||0),ed=dpc(ev,es[i18]||0);const flag=(hd!==null&&hd<0&&ed!==null&&ed>0);
    const mx=Math.max(...hs,...es,1);
    const ln=(arr,c)=>{const p=arr.map((v,i)=>`${(i*W/(D.NY-1)).toFixed(1)},${(H-4-(v/mx)*(H-12)).toFixed(1)}`).join(' ');return `<polyline points="${p}" fill="none" stroke="${c}" stroke-width="2"/>`;};
    const xs=(yi*W/(D.NY-1)).toFixed(1);
    return `<div class="panel" style="padding:14px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px"><span style="font-family:'Spline Sans Mono',monospace;font-size:8px;letter-spacing:1px;color:#a78bfa;border:1px solid #a78bfa55;border-radius:4px;padding:1px 5px">ESPEJO</span>
        ${flag?'<span style="font-family:Spline Sans Mono;font-size:9px;color:#f85149;background:rgba(248,81,73,.12);border-radius:5px;padding:2px 7px">⚠ grave ↓ / espejo ↑ · vigilar</span>':'<span style="font-family:Spline Sans Mono;font-size:9px;color:var(--dim)">sin divergencia</span>'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div onclick="pick('${h.replace(/'/g,"\\'")}')" style="cursor:pointer"><div style="font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h}</div><div style="font-family:'Bricolage Grotesque';font-size:23px;font-weight:800">${fmt(hv)}</div><div style="font-family:Spline Sans Mono;font-size:11px">${dArrow(hd)} <span style="color:var(--dim)">vs 2018</span></div></div>
        <div onclick="pick('${e.replace(/'/g,"\\'")}')" style="cursor:pointer"><div style="font-size:12px;color:#a78bfa;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e}</div><div style="font-family:'Bricolage Grotesque';font-size:23px;font-weight:800">${fmt(ev)}</div><div style="font-family:Spline Sans Mono;font-size:11px">${dArrow(ed)} <span style="color:var(--dim)">vs 2018</span></div></div></div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:9px"><line x1="${xs}" y1="0" x2="${xs}" y2="${H}" stroke="color-mix(in srgb,var(--txt) 22%,transparent)" stroke-width="1"/>${ln(hs,getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#f4711f')}${ln(es,'#a78bfa')}</svg>
      <div style="display:flex;justify-content:space-between;font-family:Spline Sans Mono;font-size:8.5px;color:var(--dim);margin-top:1px"><span>${D.anios[0].slice(2)}</span><span style="color:var(--acc)">▲ ${D.anios[yi]}</span><span>${D.anios[D.NY-1].slice(2)}</span></div></div>`;}).join('');
}
function esc(){
  const order=(fixOrder&&escOrder)?escOrder:buildEscOrder();if(!fixOrder)escOrder=order;
  const vmax=Math.max(...D.subs.map(s=>(me[s]||[])[yi]||0),1);
  document.getElementById('esc').innerHTML=order.map((s,i)=>{const v=(me[s]||[])[yi]||0;const t=v/vmax;const isE=D.espejo.includes(s);
    return `<div class="bar ${s===del?'sel':''}" onclick="pick('${s.replace(/'/g,"\\'")}')"><div class="rk">${i+1}</div><div class="dot" style="background:${D.bjc[D.sub_bj[s]]||'#94a3b8'}"></div><div class="nm">${s}${isE?'<span class="esp">ESPEJO</span>':''}</div><div class="tk"><div class="fl" style="width:${Math.max(2,100*t)}%;background:${ramp(t)}"></div></div><div class="vv">${fmt(v)}</div></div>`;}).join('');
}
function pick(s){del=s;document.getElementById('delMap').value=s;render();}
function render(){
  if(!D)return;document.getElementById('yrBig').textContent=D.anios[yi];
  const svg=document.getElementById('mapsvg');let mn=1e9,mx=-1e9;const vals={};
  Object.keys(D.munis).forEach(cv=>{const v=muniVal(cv,yi);vals[cv]=v;if(v<mn)mn=v;if(v>mx)mx=v;});
  svg.querySelectorAll('path').forEach(p=>{const v=vals[p.dataset.cv];const t=mx>mn?(v-mn)/(mx-mn):0;p.setAttribute('fill',ramp(t));});
  const v=meVal(yi),st=stateVal(yi),pct=st?Math.round(100*v/st):0;
  const tasa=D.pobYr?(v/D.pobYr[yi]*1e5):null;
  document.getElementById('diag').innerHTML=`En <span class="cy">${D.anios[yi]}</span>, ${D.nom} registró <b class="hot">${fmt(v)}</b> ${delLabel()}`+(tasa!=null?` · tasa <b>${tasa.toFixed(1)}</b>/100 mil`:``)+` <b>(${pct}%</b> del estado).`;
  termo();heat();espejo();esc();document.getElementById('delMap').value=del;
}
boot();
</script>
